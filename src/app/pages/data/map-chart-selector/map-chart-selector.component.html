<div class="map-chart-selector">
    <form [formGroup]="form">
        @for (type of sensorTypes(); track $index) {
            <label [for]="type.id">
                <input type="radio" [value]="type.id" [id]="type.id" formControlName="selectedSensorType">
                <img [src]="type.iconUrl" style="width: 8px; height: 8px;">
            </label>
        }
    </form>
</div>
