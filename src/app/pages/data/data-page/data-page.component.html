<div class="page">
    <app-header></app-header>
    <div class="main">
        <!-- START SIDEBAR -->
        <app-sidebar #sidebar side="left" height="calc(100dvh - 48px)" width="360px" iconUrl="icons/menu_open_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg" (toggled)="onSidebarToggle($event)">
            <div ngProjectAs="sidebar-content" class="sidebar-content">            
                <div>
                    <input type="datetime-local" [value]="">
                </div>
                <div class="sidebar__checkboxes">
                    @for (group of groupedCheckboxes; track $index) {
                        <app-grouped-checkboxes [group]="group" (changed)="onGroupCheckboxChange($event)" #groupedCheckbox></app-grouped-checkboxes>
                    }
                </div>
            </div>
        </app-sidebar>
        <!-- END SIDEBAR -->

        <!-- START CHIPS SLIDER -->
        <div class="chips-slider">
            @for (chip of chips; track $index) {
                <app-chip [id]="chip.id" [iconUrl]="chip.icon ?? ''" [text]="chip.label ?? chip.id" (dismiss)="onChipDismiss($event)"></app-chip>
            }
        </div>
        <!-- END CHIPS SLIDER -->

        <!-- START LAYERS MENU -->
        <div class="layers-menu">
            <app-pop-up-menu class="base-layers-menu" #baseLayersMenu position="bottom-left" maxHeight="250px" iconUrl="icons/language_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg" (toggled)="onBaseLayersMenuToggle($event)">
                <div ngProjectAs="pop-up-menu-content" class="pop-up-menu-content" [formGroup]="baseLayersForm">
                    <p class="pop-up-menu-content__title">Mappe base</p>
                    <div class="radio-group">
                        @for (item of baseLayers; track item.id) {
                            <div class="radio">
                                <input type="radio" class="radio__input" [id]="item.id" [value]="item.id" formControlName="baseLayer">
                                <label class="radio__label" [for]="item.id">{{item.label}}</label>
                            </div>
                        }
                    </div>
                </div>
            </app-pop-up-menu>
            <app-pop-up-menu class="info-layers-menu" #infoLayersMenu position="bottom-left" maxHeight="250px" iconUrl="icons/stacks_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg" (toggled)="onInfoLayersMenuToggle($event)">
                <div ngProjectAs="pop-up-menu-content" class="pop-up-menu-content">
                    <p class="pop-up-menu-content__title">Livelli informativi</p>
                    <div class="pop-up-menu-content__body">
                        @for (item of infoLayers; track item.id) {
                            <div class="checkbox">
                                <label [for]="item.id" class="checkbox__label">
                                    <input type="checkbox" [id]="item.id" class="checkbox__input" (change)="onInfoLayerCheckboxChange($event, item)">
                                    {{item.label || item.id}}
                                </label>
                            </div>
                        }
                    </div>
                </div>
            </app-pop-up-menu>
        </div>        
        <!-- END LAYERS MENU -->

        <!-- START RESET BUTTON -->
         <button type="button" class="fab reset-btn" (click)="onResetMapButtonClick()">
            <span class="mask-icon"></span>
         </button>
        <!-- END RESET BUTTON -->
        
        <!-- START MAP -->
        <app-map [position]="mapConfig.position" [zoom]="mapConfig.zoom" (click)="onMapClick()" (layerAdded)="onMapLayerAdded($event)" (layerRemoved)="onMapLayerRemoved($event)" (markerClicked)="onMapMarkerClicked($event)" #map>
            <app-map-popup [data]="popupData" #popup></app-map-popup>
        </app-map>
        <!-- END MAP -->
    </div>
</div>
