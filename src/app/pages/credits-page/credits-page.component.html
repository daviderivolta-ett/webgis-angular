<div class="page">
    <app-header [userRoles]="user ? user.roles : []">
        @if (user) {
            <app-notification-icon ngProjectAs="additional-menu-item" [notifications]="selectedTenantMsg() ? [selectedTenantMsg()!] : []" iconUrl="./images/icons/search_activity_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg"></app-notification-icon>
        }
    </app-header>
    <div class="main">
        <p class="credits-title">I partner che hanno collaborato al progetto</p>
        <div class="credits">
            <img src="./images/logo.png" class="credits-logo arpal" alt="Finanziato dall'Unione Europea">
            <img src="./images/credits/finanziato_unione_europea_logo.svg" class="credits-logo eu-funded" alt="Finanziato dall'Unione Europea">
            <img src="./images/credits/dipartimento_trasformazione_digitale_logo.svg" class="credits-logo dipartimento-trasformazione-digitale" alt="Dipartimento della trasformazione digitale">
            <img src="./images/credits/agenzia_cybersicurezza_nazionale_logo.png" class="credits-logo agenzia-cybersicurezza-nazionale" alt="Agenzia cybersicurezza nazionale">
            <img src="./images/credits/ett_logo.png" class="credits-logo ett" alt="Agenzia cybersicurezza nazionale">
        </div>
    </div>
</div>
