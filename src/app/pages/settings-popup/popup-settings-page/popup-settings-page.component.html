<div class="page">
    <app-header [isAuth]="user ? true : false"></app-header>
    <div class="main">
        <!--START SIDEBAR  -->
        <app-sidebar height="calc(100dvh - 48px)" width="360px" iconUrl="images/icons/menu_open_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg">
            <div ngProjectAs="sidebar-content">
                <app-settings-nav-menu></app-settings-nav-menu>
            </div>
        </app-sidebar>
        <!-- END SIDEBAR -->

        <!-- START CONTENT -->
        <div class="content">
            <h3 class="title">Configurazione popup</h3>
            <form class="form" [formGroup]="form" (submit)="onFormSubmit()">
                <div class="configs">
                    @for (keyvalue of stationPopupConfig | keyvalue; track $index) {
                        <div class="custom-checkbox">
                            <input class="custom-checkbox__input" [id]="keyvalue.key" type="checkbox" [formControlName]="keyvalue.key">
                            <label class="custom-checkbox__label" [for]="keyvalue.key">{{keyvalue.key}}</label>
                        </div>
                    }
                </div>
                <div class="save-button" class="save-button">
                    <app-loading-btn [isLoading]="isLoading">
                        <button #button class="save-button__btn" type="submit" [disabled]="form.invalid || !form.dirty">Salva modifiche</button>
                    </app-loading-btn>
               </div>
            </form>
        </div>
        <!-- END CONTENT -->
    </div>
</div>
