<div class="sort-header" (click)="sort(direction)">
    <ng-content></ng-content>

    @if (direction === 'asc') {
        <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M480-333 240-573l51-51 189 189 189-189 51 51-240 240Z"/></svg>
        </span>
    }
    @else if (direction === 'desc') {
        <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M480-525 291-336l-51-51 240-240 240 240-51 51-189-189Z"/></svg>
        </span>
    }
</div>
