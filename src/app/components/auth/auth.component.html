<div class="auth">
    <button type="button" class="auth-btn" (click)="initAuthFlow()">
        <span class="auth-btn__icon" [style.maskImage]="'url(' + (user ? logoutIcon() : loginIcon()) + ')'" [style.webkitMaskImage]="'url(' + (user ? logoutIcon() : loginIcon()) + ')'"></span>
        <span class="auth-btn__text">{{user ? logoutText() : loginText()}}</span>
    </button>
</div>
