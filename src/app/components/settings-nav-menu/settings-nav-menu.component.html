<div class="settings-nav-menu">
    <h3>Configurazioni</h3>
    <div class="settings-links">
        @for (route of menu; track $index) {
            <a class="setting-link" [routerLink]="'/settings/' + route.path" routerLinkActive="setting-link--active">{{route.label}}</a>
        }
    </div>
</div>
